<head>

<title>MG Divertissement à bord</title>

<meta name="theme-color" content="#050912">
<meta name="color-scheme" content="dark light">
<script>
/* filet de sécurité : si l'application n'a pas démarré après 6,5 s, le splash propose de relancer puis se retire */
setTimeout(function(){var s=document.getElementById("splash");if(!s||window.__appReady)return;var h=document.getElementById("spHint");if(h){h.textContent="Démarrage interrompu : touchez pour relancer";h.classList.add("on")}s.style.cursor="pointer";s.addEventListener("click",function(){location.reload()});setTimeout(function(){var t=document.getElementById("splash");if(t&&!window.__appReady)t.classList.add("out")},3500)},6500);
</script>
<script>try{var m=JSON.parse(localStorage.getItem("mg.theme"))||"dark";document.documentElement.dataset.theme=m==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --bg:#050912; --bg2:#0b1426; --glass:rgba(18,30,56,.55); --line:rgba(140,175,255,.16);
  --txt:#f2f6ff; --mut:#9db0d3; --acc:#2f8bff; --acc2:#63b3ff; --glow:0 0 0 2px #2f8bff,0 0 28px rgba(47,139,255,.55);
  --r:22px; --txt2:#dfe8ff; --dockbg:rgba(10,18,36,.7); --viewbg:linear-gradient(180deg,#07101f,#050912); --minibg:rgba(12,22,44,.92);
  --chip:rgba(255,255,255,.07); --track:rgba(255,255,255,.2); --swoff:#3b4660; --cardbg:rgba(18,30,56,.55); --playbg:#fff; --playtx:#0b1220;
}
html[data-theme=light]{
  --bg:#e6edf8; --glass:rgba(255,255,255,.7); --line:rgba(30,60,120,.2); --txt:#0b1830; --txt2:#1c2f55; --mut:#4a5e86; --acc:#1f78f0; --acc2:#1f78f0;
  --dockbg:rgba(255,255,255,.76); --viewbg:linear-gradient(180deg,#f6f9fe,#e0e9f6); --minibg:rgba(255,255,255,.95);
  --chip:rgba(20,50,110,.08); --track:rgba(20,50,110,.2); --swoff:#a9b6cf; --playbg:#0b1830; --playtx:#fff; --glow:0 0 0 2px #1f78f0,0 0 28px rgba(31,120,240,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.d{stroke-width:2.4}
.ico .f{fill:var(--ic,currentColor);fill-opacity:.38}
.ico .k{fill:currentColor;stroke:none}

/* ---------- Arrière-plan ---------- */
:root{--viewov:rgba(4,8,16,.30)}
html[data-theme=light]{--viewov:rgba(238,243,251,.40)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(2.2vh,10px) 2.4vw max(2.4vh,12px);overflow:hidden}
.sc{--sbg:radial-gradient(120% 90% at 12% 0%,#13264d 0%,transparent 55%),radial-gradient(110% 90% at 92% 100%,#2b1650 0%,transparent 58%),linear-gradient(180deg,#060b17 0%,#04070f 100%);--o1:rgba(47,107,255,.55);--o2:rgba(138,63,252,.42);--o3:rgba(0,190,220,.20);background:var(--sbg);position:relative;overflow:hidden}
.sc i{position:absolute;border-radius:50%;pointer-events:none}
.sc .a1{background:radial-gradient(circle,var(--o1),transparent 65%)}.sc .a2{background:radial-gradient(circle,var(--o2),transparent 65%)}.sc .a3{background:radial-gradient(circle,var(--o3),transparent 65%)}
.sc .pat{position:absolute;inset:0;pointer-events:none;display:none}
#scene{position:fixed;inset:0;z-index:0}
#scene .a1{width:60vmax;height:60vmax;left:-20vmax;top:-30vmax}
#scene .a2{width:55vmax;height:55vmax;right:-18vmax;bottom:-28vmax}
#scene .a3{width:34vmax;height:34vmax;left:38%;top:55%}
html[data-anim] #scene .a1{animation:dr1 28s ease-in-out infinite alternate;will-change:transform}html[data-anim] #scene .a2{animation:dr2 34s ease-in-out infinite alternate;will-change:transform}html[data-anim] #scene .a3{animation:dr3 40s ease-in-out infinite alternate;will-change:transform}
html[data-probe] #scene .a1{animation:dr1 1.4s linear infinite alternate!important}
@keyframes dr1{to{transform:translate(9vmax,6vmax) scale(1.12)}}@keyframes dr2{to{transform:translate(-8vmax,-5vmax) scale(1.1)}}@keyframes dr3{to{transform:translate(-6vmax,-8vmax) scale(1.2)}}@keyframes zm{to{transform:scale(1.08)}}
#scene .mark{position:absolute;right:-5vh;bottom:-9vh;width:72vh;aspect-ratio:1;background:url(icons/logo-mg.png) center/contain no-repeat;opacity:.032}
#scene .grain{position:absolute;inset:0;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>")}
#scene .wall{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s}#scene .wall.on{opacity:1}
#scene .wall::after{content:"";position:absolute;inset:0;background:rgba(4,8,16,.58)}
#scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.42));pointer-events:none}

.sc[data-bg=piste] .pat::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(5,8,16,.78) 0,transparent 55%)}
.sc[data-bg=titane]{--sbg:linear-gradient(160deg,#2d3138 0%,#17191d 55%,#0d0e11 100%);--o1:rgba(160,190,230,.22);--o2:rgba(255,255,255,.09);--o3:rgba(90,120,170,.18)}
.sc[data-bg=titane] .pat{display:block;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 7px),linear-gradient(115deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%)}
.sc[data-bg=rouge]{--sbg:radial-gradient(120% 90% at 85% 0%,#5e0a1a 0%,transparent 60%),radial-gradient(100% 80% at 10% 100%,#2c0711 0%,transparent 60%),linear-gradient(180deg,#0d0507,#060203);--o1:rgba(228,0,43,.50);--o2:rgba(255,120,60,.20);--o3:rgba(130,0,35,.30)}
.sc[data-bg=heritage]{--sbg:radial-gradient(120% 90% at 15% 0%,#0f4a38 0%,transparent 58%),linear-gradient(180deg,#05150f,#030a07);--o1:rgba(20,165,115,.40);--o2:rgba(212,175,55,.26);--o3:rgba(20,100,80,.25)}
/* thème clair : base perle, accents de la couleur choisie */

html[data-theme=light] .sc[data-bg=heritage]{--o1:rgba(30,170,120,.30);--o2:rgba(212,175,55,.26);--o3:rgba(30,120,100,.20)}

body .view{background:var(--viewov)}

@media (prefers-reduced-motion:reduce){#scene i,#scene .pat{animation:none}}
/* aperçus de la galerie */
.bgg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 6px}
.bgp{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;border:2px solid transparent;text-align:center}
.bgp.on{border-color:var(--acc)}.bgp b{font-weight:500;font-size:13px}
.pv{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center}
.pv i{animation:none!important}
.pv .a1{width:80%;height:80%;left:-20%;top:-35%}.pv .a2{width:70%;height:70%;right:-15%;bottom:-35%}.pv .a3{width:40%;height:40%;left:40%;top:50%}
.pv.photo{background-color:var(--chip);color:var(--acc2);font-size:26px}
@media (max-width:700px){.bgg{grid-template-columns:repeat(2,1fr)}}

/* ---------- Barre supérieure ---------- */
.top{display:flex;align-items:center;gap:2vw;height:9vh;min-height:52px}
.logo{width:clamp(44px,5.4vw,70px);aspect-ratio:1;object-fit:contain}
.sep{width:1px;height:60%;background:var(--line)}
.who{display:flex;align-items:center;gap:.8em;font-size:clamp(14px,1.6vw,21px);color:var(--txt2)}
.who .ico{font-size:1.6em;stroke-width:1.5}
.sp{flex:1}
.stat{display:flex;align-items:center;gap:clamp(12px,1.8vw,26px);font-size:clamp(14px,1.8vw,24px)}
.stat .ico{font-size:1.25em}
.stat .sep{height:1.4em}


/* ---------- Accueil ---------- */
.hero{margin-top:auto;text-align:center;padding-bottom:1.8vh}
.hero h1{font-size:clamp(26px,4.4vw,58px);font-weight:600;letter-spacing:-.01em;text-shadow:0 3px 24px rgba(0,0,0,.7)}
.hero p{font-size:clamp(14px,1.8vw,24px);color:var(--mut);margin-top:.35em}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:1.5vw;height:29vh;min-height:150px}
.tile{position:relative;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:clamp(14px,1.75vw,24px);color:#fff;transition:transform .18s,box-shadow .18s,border-color .18s}
.tile .bg{position:absolute;inset:0;opacity:.85}
.tile>*:not(.bg){position:relative}
.tile .ico{font-size:clamp(46px,6.2vw,88px);filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))}
.tile .cnt{font-size:.62em;color:rgba(255,255,255,.78);margin-top:-.6vh}
.t-films{--ic:#7fb3ff}.t-musique{--ic:#d08cff}.t-jeux{--ic:#5de0ff}.t-tv{--ic:#ffb38a}.t-livres{--ic:#ffc987}.t-photos{--ic:#8fe3a8}
.tile.sel{box-shadow:var(--glow);border-color:transparent;transform:translateY(-1.2vh) scale(1.02)}
.tile:active{transform:scale(.97)}
.t-films .bg{background:radial-gradient(circle at 70% 25%,rgba(120,170,255,.35),transparent 55%),linear-gradient(160deg,#16356b,#0d1d3f)}
.t-musique .bg{background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(190,90,255,.28) 9px 14px) bottom/100% 55% no-repeat,linear-gradient(170deg,#2a1b6e,#0f0b2b)}
.t-jeux .bg{background:radial-gradient(circle at 30% 80%,rgba(180,70,255,.4),transparent 55%),radial-gradient(circle at 80% 20%,rgba(40,200,255,.35),transparent 50%),linear-gradient(170deg,#12205e,#0a0e28)}
.t-tv .bg{background:linear-gradient(180deg,#2b5ea8 0%,#a97a86 55%,#27476b 56%,#14264a 100%)}
.t-livres .bg{background:radial-gradient(ellipse at 50% 0,rgba(255,176,90,.34),transparent 60%),linear-gradient(170deg,#3b2411,#170f07)}
.t-photos .bg{background:linear-gradient(180deg,#3d73b8 0%,#8aa6c4 40%,#2c4a3f 62%,#18301f 100%)}

/* ---------- Modes d’affichage ---------- */
.vms{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.vm{width:clamp(42px,4vw,52px);height:clamp(38px,3.6vw,46px);border-radius:999px;display:grid;place-items:center;font-size:24px;color:var(--mut)}
.vm.on{background:var(--acc);color:#fff}
.cov{position:relative;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45);display:grid;place-items:center}
.cov.v{aspect-ratio:16/10}.cov.a{aspect-ratio:1}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov .ci{position:relative;font-size:clamp(40px,7vh,80px);color:rgba(255,255,255,.92);filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.cov.v .ci{background:rgba(0,0,0,.42);border-radius:50%;padding:.16em;font-size:clamp(34px,5.4vh,58px);backdrop-filter:blur(4px)}
.cgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cgrid.audio{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{position:relative;cursor:pointer;transition:transform .15s}.card:active{transform:scale(.97)}
.card.cur .cov{box-shadow:0 0 0 3px var(--acc),0 0 26px rgba(47,139,255,.55)}
.card .ct{padding:9px 4px 0}.cn{font-size:clamp(15px,1.6vw,20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cs{font-size:.85em;color:var(--mut);margin-top:2px}
.card>.x{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.card>.x .ico{font-size:20px}
.cf{--cw:min(46vh,72vw);display:flex;flex-direction:column;height:100%}.cf.audio{--cw:min(36vh,60vw)}
.cft{display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;perspective:1100px;padding:3vh 0 5vh;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cft::-webkit-scrollbar{display:none}
.cft::before,.cft::after{content:"";flex:0 0 calc(50% - var(--cw)*.36)}
.cfi{flex:0 0 var(--cw);margin:0 calc(var(--cw)*-.14);scroll-snap-align:center;transform-style:preserve-3d;will-change:transform}
.cfi .cov{-webkit-box-reflect:below 3px linear-gradient(transparent 72%,rgba(255,255,255,.22))}
.cfinfo{text-align:center;margin-top:1vh}.cfinfo .cn{font-size:clamp(20px,2.4vw,32px);font-weight:500}.cfinfo .cs{font-size:clamp(14px,1.4vw,18px)}
.cfact{display:flex;gap:12px;justify-content:center;margin-top:2vh}

/* ---------- Jaquettes, bannière, jeux ---------- */
.btn.play{background:var(--playbg);color:var(--playtx);font-weight:600}
.cov.poster{aspect-ratio:2/3;border-radius:10px;align-content:stretch}
.cov img.mgb{inset:auto;top:8px;left:8px;width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 4px #000);z-index:2}
.pt{position:absolute;left:0;right:0;bottom:0;padding:44px 12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-weight:800;font-size:clamp(16px,1.9vw,26px);line-height:1.1;text-align:left;color:#fff;z-index:1}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.3);z-index:3}.prog b{display:block;height:100%;background:var(--acc2)}
.cov.ph{aspect-ratio:3/2;border-radius:14px}
.cov.g{aspect-ratio:1}.cov.g .ci{width:66%;display:block;filter:none}.cov.g .ci svg{width:100%;height:auto;display:block}
.ttt button svg,.mem button svg{width:58%;height:58%}.pfc button svg{width:70%;height:70%}.pfr{display:flex;gap:18px;justify-content:center;align-items:center;min-height:clamp(48px,9vh,76px)}.pfr svg{width:clamp(44px,8vh,72px);height:auto}.st.big .ico{display:inline-block;vertical-align:-.15em;margin-right:.3em}
.cgrid.video{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cgrid.photo{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cgrid.game{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.cf.video{--cw:min(26vh,40vw)}.cf.photo{--cw:min(62vh,80vw)}.cf.game{--cw:min(34vh,60vw)}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}.hrow .card{flex:0 0 150px}
.rowt{font-size:clamp(17px,1.9vw,24px);font-weight:600;margin:2.4vh 0 1.2vh}
.banner{position:relative;min-height:clamp(180px,34vh,320px);border-radius:14px;background-size:cover;background-position:center;color:#fff;display:flex;align-items:flex-end;padding:3vh 3vw;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,9,18,.92),rgba(5,9,18,.15) 72%)}
.banner .bt{position:relative;max-width:58%}.banner small{opacity:.8;font-size:clamp(13px,1.3vw,17px)}
.banner h2{font-size:clamp(24px,3.6vw,48px);font-weight:800;margin:.15em 0;line-height:1.05}.banner p{opacity:.8;margin-bottom:1.6vh}
.card>.x.j{right:54px}
.gplay{display:grid;place-items:start center;padding-top:1vh}.gplay .gcard{width:min(94vw,560px)}
.st.big{font-size:1.3em;color:var(--txt);min-height:1.4em}
.p4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(88vw,460px,52vh);padding:10px;background:#1a49a8;border-radius:18px}
.p4 button{aspect-ratio:1;border-radius:50%;background:#071a45}.p4 button.r{background:#e53935}.p4 button.y{background:#fdd835}
.pfc{display:flex;gap:14px}.pfc button{display:grid;place-items:center;font-size:clamp(40px,8vh,68px);width:clamp(80px,12vh,116px);aspect-ratio:1;border-radius:24px;background:var(--chip);border:1px solid var(--line)}
.numin{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:28px;width:160px;text-align:center}

/* ---------- Étagère du lanceur ---------- */
.shelf{display:flex;gap:1.2vw;height:9vh;min-height:60px;margin-bottom:2vh}
.resume,.chip{display:flex;align-items:center;gap:.8em;padding:0 1.2vw;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left;min-width:0;transition:border-color .2s,box-shadow .2s,transform .12s}
.resume:active,.chip:active{transform:scale(.97)}
.resume{flex:2.2}.chip{flex:1;font-size:clamp(13px,1.4vw,19px);white-space:nowrap}
.resume .pl{width:clamp(40px,4.8vh,56px);aspect-ratio:1;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:clamp(20px,2.4vh,28px);flex:none;box-shadow:0 0 18px rgba(47,139,255,.45)}
.resume .tx{flex:1;min-width:0}.resume .t1{font-size:clamp(14px,1.5vw,20px);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .t2{font-size:clamp(12px,1.2vw,16px);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px;display:none}.resume .bar i{display:block;height:100%;width:0;background:var(--acc2)}
.resume.live{border-color:var(--acc)}.resume.live .bar{display:block}
.chip .ico{font-size:1.9em;color:var(--acc2);flex:none}.chip small{display:block;font-size:.76em;color:var(--mut);margin-top:2px}
.chip.on{border-color:var(--acc);box-shadow:0 0 18px rgba(47,139,255,.3)}
.seg{display:flex;gap:6px}.seg button{padding:.6em 1.1em;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:clamp(14px,1.4vw,18px)}.seg button.on{background:var(--acc);color:#fff;border-color:transparent}
#btnTheme{display:grid;place-items:center}

/* ---------- Barre de commandes ---------- */
.dock{margin-top:2.4vh;height:11vh;min-height:60px;border-radius:999px;border:1px solid var(--line);background:var(--dockbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:1.8vw;padding:0 2.4vw;box-shadow:0 -1px 40px rgba(47,139,255,.12)}
.dock .ico{font-size:clamp(24px,2.6vw,36px)}
.dock .ib{display:grid;place-items:center;width:clamp(44px,4.6vw,64px);aspect-ratio:1;border-radius:50%}
.dock .ib:active{background:rgba(255,255,255,.1)}
.rng{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;outline:0;
  background:linear-gradient(90deg,var(--acc2) var(--p,50%),var(--track) var(--p,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:clamp(22px,2.2vw,30px);height:clamp(22px,2.2vw,30px);border-radius:50%;background:var(--acc);border:3px solid #cfe4ff;box-shadow:0 0 14px rgba(47,139,255,.7)}
.rng::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--acc);border:3px solid #cfe4ff}
.mode{display:flex;align-items:center;gap:1em;padding:.7em 1.4em;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:clamp(13px,1.45vw,20px);white-space:nowrap}
.sw{position:relative;width:clamp(52px,5vw,70px);height:clamp(28px,2.7vw,38px);border-radius:999px;background:var(--swoff);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;height:calc(100% - 6px);aspect-ratio:1;border-radius:50%;background:#fff;transition:left .2s,transform .2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:calc(100% - 3px);transform:translateX(-100%)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:900;transition:opacity .15s}

/* ---------- Écrans secondaires ---------- */
.view{position:fixed;inset:0;z-index:50;background:var(--viewbg);display:none;flex-direction:column;padding:max(2.2vh,10px) 2.4vw 0}
.view.on{display:flex;animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:center;gap:1.6vw;height:9vh;min-height:56px}
.vh h2{font-size:clamp(20px,2.6vw,34px);font-weight:600;flex:1}
.btn{display:inline-flex;align-items:center;gap:.6em;padding:.75em 1.4em;border-radius:999px;background:var(--acc);color:#fff;font-size:clamp(14px,1.5vw,19px);font-weight:500}
.btn.ghost{background:var(--chip);border:1px solid var(--line);color:var(--txt)}
.btn:active{filter:brightness(.85)}
.vb{flex:1;overflow:auto;padding:1vh 0 12vh;-webkit-overflow-scrolling:touch}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:clamp(15px,1.8vw,22px);line-height:1.5}
.empty b{display:block;color:var(--txt);font-size:1.3em;margin-bottom:.4em;font-weight:500}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);text-align:left;min-height:72px}
.item.cur{border-color:var(--acc);box-shadow:0 0 18px rgba(47,139,255,.35)}
.item .ico{font-size:30px;color:var(--acc2);flex:none}
.item .nm{flex:1;min-width:0;font-size:clamp(15px,1.6vw,20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{display:block;font-size:.8em;color:var(--mut);margin-top:3px}
.item .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}
.item .x:active{background:rgba(255,255,255,.1)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pgrid button{aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:var(--chip)}
.pgrid img{width:100%;height:100%;object-fit:cover}
.mini{position:absolute;left:2.4vw;right:2.4vw;bottom:max(2vh,10px);border-radius:28px;background:var(--minibg);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 18px;display:none;align-items:center;gap:14px}
.mini.on{display:flex}
.mini .info{width:26%;min-width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(14px,1.5vw,19px)}
.mini .ib{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none}
.mini .ib.big{background:var(--acc);color:#fff}
.mini .time{font-size:13px;color:var(--mut);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.mini select{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:15px}
.overlay{color:#fff;position:fixed;inset:0;z-index:200;background:#000;display:none;align-items:center;justify-content:center}
.overlay.on{display:flex}
.overlay video{width:100%;height:100%;background:#000}
.overlay img{max-width:100%;max-height:100%;object-fit:contain}
.overlay .close,.overlay .nav{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:30px;z-index:3;border:1px solid var(--line)}
.overlay .close{top:max(2vh,12px);right:2.4vw}
.overlay .nav.p{left:2vw}.overlay .nav.n{right:2vw}
.overlay .msg{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(0,0,0,.7);font-size:16px;display:none;z-index:3}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;height:100%}
.gcard{border-radius:24px;background:var(--glass);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.gcard h3{font-weight:500;font-size:clamp(18px,2vw,26px)}
.gcard .st{color:var(--mut);min-height:1.4em;text-align:center}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(70vw,300px,38vh)}
.ttt button,.mem button{aspect-ratio:1;border-radius:16px;background:var(--chip);border:1px solid var(--line);font-size:clamp(28px,5vh,52px);display:grid;place-items:center}
.ttt button.w{background:rgba(47,139,255,.35)}

.mem button.up{background:rgba(47,139,255,.22)} .mem button.ok{background:rgba(70,200,120,.25)}
.set{max-width:760px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--line);font-size:clamp(15px,1.6vw,20px)}
.row label{flex:1}.row input[type=number],.row input[type=text],.row input[type=url]{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;width:130px}
.row input[type=text],.row input[type=url]{width:auto;flex:1;min-width:0}
.addtv{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.addtv input{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;flex:1;min-width:160px}
#toast{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);background:var(--minibg);color:var(--txt);border:1px solid var(--line);padding:12px 20px;border-radius:16px;z-index:999;display:none;font-size:16px}

/* ---------- Écran de démarrage ---------- */
#splash{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 50%,#0a1020 0%,#04060b 72%);color:#fff;transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash .in{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.6vh,34px)}
#splash img.mg{width:clamp(96px,17vmin,176px);height:auto;opacity:0;transform:translateY(6px);animation:spl-a 1.1s .25s cubic-bezier(.2,.7,.2,1) forwards}
#splash .line{width:clamp(90px,15vmin,150px);height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:scaleX(0);animation:spl-c 1s .9s cubic-bezier(.3,.7,.2,1) forwards}
#splash .name{font-size:clamp(11px,1.7vmin,15px);font-weight:300;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#8d99b3;opacity:0;animation:spl-b .9s 1.3s ease forwards}
#splash .hint{position:absolute;bottom:max(5vh,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.06em;color:#6f7b95;opacity:0;transition:opacity .7s}
#splash .hint.on{opacity:.85}
@keyframes spl-a{to{opacity:1;transform:none}}@keyframes spl-b{to{opacity:1}}@keyframes spl-c{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}.view.on{animation:none}}
html[data-motion=reduce] *{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}

/* ---------- Fenêtres et sous-titres ---------- */
#mdl{position:fixed;inset:0;z-index:650;background:rgba(3,6,14,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;place-items:center}#mdl.on{display:grid}
.mp{width:min(92vw,520px);max-height:84vh;overflow:auto;border-radius:26px;background:var(--minibg);border:1px solid var(--line);padding:22px 22px 18px;color:var(--txt)}
.mp h3{font-size:20px;font-weight:600}.msub{color:var(--mut);margin:2px 0 12px;font-size:15px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.mrow .mt{flex:1;min-width:0}.mrow .mt b{font-weight:500;display:block}.mrow .mt small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}.mrow .x:active{background:var(--chip)}
.mrow .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none}.mrow.on .rd{border-color:var(--acc);background:radial-gradient(circle,var(--acc) 42%,transparent 48%)}
.mact{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.mempty{color:var(--mut);padding:12px 0}
.overlay .cc{position:absolute;top:max(2vh,12px);right:calc(2.4vw + 68px);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:28px;z-index:3;border:1px solid var(--line)}

/* ---------- Barre du bas, centre de contrôle, applications ---------- */
:root{--dh:max(11vh,60px);--dg:max(2.4vh,12px)}
#app>#dock.dock{position:fixed;left:2.4vw;right:2.4vw;bottom:var(--dg);margin:0;z-index:60;gap:clamp(8px,1.1vw,18px);padding:0 clamp(12px,1.6vw,28px)}
#app{padding-bottom:calc(var(--dh) + var(--dg) * 2)}
.view{bottom:calc(var(--dh) + var(--dg) * 1.6)}
.dock .ib:disabled{opacity:.35}.dock .ib.big{background:var(--acc);color:#fff}
.dock .ib,.dock>.ico{flex:none}.dock .rng{min-width:50px}
.dock .tp{display:flex;align-items:center;gap:4px;flex:none}.dock .tt{max-width:11vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(12px,1.2vw,16px);color:var(--mut);margin-left:6px}
.dock .mode{padding:.5em 1em;gap:.7em;flex:none}
.dock .sep{height:55%}
@media (max-width:1180px){.dock .tt,.dock .mode span{display:none}}
@media (max-width:900px){.dock .mode,.dock #bri,.dock .brico,.dock .tt{display:none}}
html[data-kids] #btnApps{display:none}
.sydot{width:12px;height:12px;border-radius:50%;background:#f87171;box-shadow:0 0 8px currentColor;flex:none}.sydot.gn{background:#34d399;color:#34d399}.sydot.or{background:#fbbf24;color:#fbbf24}.sydot.rd{background:#f87171;color:#f87171}
.batt{display:inline-flex;align-items:center;gap:.35em;font-size:clamp(13px,1.5vw,20px)}.batt .ico{font-size:1.5em}.batt.low{color:#f87171}
.hubs{display:grid;gap:10px;margin:10px 0 14px}.hr{display:flex;align-items:center;gap:14px}.hr .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--acc2);font-size:22px;flex:none}
.hubg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hubt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:18px;background:var(--chip);border:1px solid var(--line);text-align:left;min-height:96px}
.hubt .hi{font-size:26px;color:var(--acc2)}.hubt b{font-weight:500;font-size:15px}.hubt small{color:var(--mut);font-size:12.5px}
.hubt.on{border-color:var(--acc);background:rgba(47,139,255,.16)}.hubt.on .hi{color:var(--acc)}
.mp.wide{width:min(94vw,640px)}
.apg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;margin:14px 0 4px}
.apt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;position:relative;border-radius:18px}
.apt:active{transform:scale(.96)}
.api{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:32px;overflow:hidden}.api img{width:100%;height:100%;object-fit:cover}
.apt b{font-weight:500;font-size:14px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.apt .aps{display:flex;gap:4px}.apt .aps i{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--txt)}.apt .aps .ico{font-size:16px}
.apx{display:grid;gap:10px}.apx .ptxt{margin:0}
.opp{display:grid;gap:10px;width:100%}
.opp button{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--chip);border:1px solid var(--line);text-align:left;width:100%}
.opp button .oi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(47,139,255,.16);color:var(--acc2);font-size:24px;flex:none}
.opp button b{display:block;font-weight:500}.opp button small{color:var(--mut);display:block}
.opp button.on{border-color:var(--acc);box-shadow:0 0 18px rgba(47,139,255,.28)}.opp button:disabled{opacity:.45}
.gsub{color:var(--mut);font-size:15px;text-align:center}

/* ---------- Lecteur intégré à la barre du bas ---------- */
.dock .mini{position:static;left:auto;right:auto;bottom:auto;display:none;flex:1;min-width:0;align-items:center;gap:12px;padding:0;background:none;border:0;box-shadow:none;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.dock .mini.on{display:flex}
.dock .mini .mcov{width:46px;height:46px;border-radius:11px}
.dock .mini .info{width:auto;flex:0 1 190px;min-width:90px;font-size:clamp(13px,1.3vw,17px)}
.dock .mini .time{font-size:12px;min-width:36px}
.dock .mini .rng{min-width:80px}
.dock .mini select{padding:6px 8px;font-size:14px}
.dock.np .brico,.dock.np #bri,.dock.np .mode,.dock.np .sp,.dock.np .s2,.dock.np #vIco{display:none}
.dock.np #vol{flex:0 0 clamp(70px,9vw,120px)}
.dock.np .ib{width:clamp(38px,3.4vw,48px)}.dock.np .ib.big{width:clamp(44px,4vw,56px)}
@media (max-width:1100px){.dock .mini .info,.dock .mini .time{display:none}}

/* ---------- Pochettes ---------- */
.lt{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;display:grid;place-items:center;color:#fff}
.lt.v{width:36px;height:54px}.lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.item .lt .ico{font-size:24px;color:#fff}
.mcov{width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--chip);display:grid;place-items:center;flex:none;font-size:26px;color:var(--acc2)}.mcov img{width:100%;height:100%;object-fit:cover}
.mini .info b{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:500}.mini .info small{display:block;color:var(--mut);font-size:.8em;overflow:hidden;text-overflow:ellipsis}

/* ---------- Profils ---------- */
.who{display:flex;align-items:center;gap:.7em;padding:.3em .9em .3em .35em;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:clamp(14px,1.6vw,21px);color:var(--txt2)}
.who .ico{font-size:1em;opacity:.7}
.av{position:relative;width:clamp(32px,3.4vw,42px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:clamp(14px,1.5vw,19px);flex:none}
.av .kb{position:absolute;right:-5px;bottom:-5px;font-size:15px;background:var(--minibg);color:var(--acc2);border-radius:50%;display:grid;place-items:center;width:18px;height:18px}.av .kb .ico{font-size:14px}
.ptxt{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;width:100%}
.sws{display:flex;gap:10px}.swt{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.swt.on{border-color:var(--txt)}
.mrow .sw{width:54px;height:30px;flex:none}
.card>.x.on{background:var(--acc);color:#fff}.btn.ghost.sel{border-color:var(--acc);color:var(--acc2)}.item .x.on{color:var(--acc2)}
.seg button{display:inline-flex;align-items:center;gap:.3em;white-space:nowrap}
#plim{flex-wrap:wrap}#plim .mt{flex:1 1 100%}
html[data-kids] .tile[data-c=tv]{display:none}html[data-kids] .tiles{grid-template-columns:repeat(5,1fr)}
#tmu{position:fixed;inset:0;z-index:690;background:rgba(3,6,14,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;place-items:center}#tmu.on{display:grid}

/* ---------- Panneau des réglages ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start;padding-bottom:6vh}
.sg{border-radius:22px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:4px 18px 6px}
.sg h3{font-size:clamp(16px,1.6vw,20px);font-weight:600;padding:14px 0 8px}
.srow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.sg h3+.srow{border-top:0}
.si{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--acc2);flex:none;font-size:22px}
.sl{flex:1;min-width:0}.sl b{font-weight:500;font-size:clamp(15px,1.5vw,18px);display:block}.sl small{color:var(--mut);font-size:.82em;display:block;margin-top:2px}
.sctl{display:flex;align-items:center;gap:8px;flex:none}.sctl>span{color:var(--mut);font-size:clamp(14px,1.4vw,17px)}
.srow .btn{padding:.55em 1.1em;font-size:15px}
.srow .sw{width:54px;height:30px;flex:none}
.srow input[type=number]{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:17px;width:84px;text-align:center}
.srow .rng{width:170px;flex:none}
.sbar{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin:2px 0 6px}.sbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.seg button{font-size:15px}
.st.win{color:#4ade80}.st.lose{color:#ff6b6b}
#pin{position:fixed;inset:0;z-index:700;background:rgba(3,6,14,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;place-items:center}
#pin.on{display:grid}
.pinp{width:min(90vw,340px);border-radius:28px;border:1px solid var(--line);background:var(--minibg);padding:26px 22px;text-align:center;color:var(--txt)}
.pinp h3{font-weight:500;font-size:19px;margin-bottom:16px}
#pinD{display:flex;gap:14px;justify-content:center;margin-bottom:20px}#pinD i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}#pinD i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:clamp(52px,8vh,64px);border-radius:18px;background:var(--chip);border:1px solid var(--line);font-size:24px;display:grid;place-items:center}.pad button:active{background:var(--acc);color:#fff}

/* ---------- Cover Flow agrandi, menus et accueil épuré ---------- */
.vb.hascf{padding:0;overflow:hidden;display:flex;flex-direction:column}
.cf{flex:1;min-height:0;height:auto;container-type:size;--room:calc(100cqh - 150px)}
.cf.audio,.cf.game{--cw:clamp(150px,var(--room),88cqw)}
.cf.video{--cw:clamp(110px,calc(var(--room) / 1.5),60cqw)}
.cf.photo{--cw:clamp(220px,calc(var(--room) * 1.5),90cqw)}
.cft{flex:1;min-height:0;padding:0}
.cfi .cov{-webkit-box-reflect:none;box-shadow:0 14px 36px rgba(0,0,0,.45)}
.cfinfo{flex:none;margin:0;padding:.8vh 0 .4vh}
.cfact{margin-top:1.4vh}.cfact .btn.more{padding:.75em 1em}
.card>.x.more{right:8px}
.menu{margin:8px 0 4px}.mrow .mi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--chip);color:var(--acc2);font-size:20px;flex:none}
.shelf .chip,.hero p{display:none}
.hero{margin-top:auto;margin-bottom:auto;padding-bottom:0}
.shelf{margin-bottom:2.4vh}
.shelf.playing{display:none}

/* ---------- Transparence (verre dépoli) ---------- */
:root{--tr:.6;--glass:rgba(18,30,56,calc(.82 - .62 * var(--tr)));--dockbg:rgba(10,18,36,calc(.88 - .66 * var(--tr)));--gline:rgba(160,195,255,.16)}
html[data-theme=light]{--glass:rgba(255,255,255,calc(.9 - .66 * var(--tr)));--dockbg:rgba(255,255,255,calc(.92 - .66 * var(--tr)));--gline:rgba(30,60,120,.16)}
#app>#dock.dock,.resume{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sg,.tile{backdrop-filter:none;-webkit-backdrop-filter:none}
#app>#dock.dock{border-color:var(--gline);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.22)}
.sg,.resume,.tile{border-color:var(--gline);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.tile .bg{opacity:calc(.97 - .55 * var(--tr))}

/* ---------- Lecture immersive ---------- */
#np{position:fixed;inset:0;z-index:160;display:none;color:#fff;overflow:hidden;background:#05070d;--npc:hsl(215,70%,62%);--acc:var(--npc);--acc2:var(--npc)}
#np.on{display:block}
#np .npbg{position:absolute;left:-12%;top:-12%;width:32%;height:32%;transform:scale(3.75);transform-origin:0 0;background-size:cover;background-position:center;filter:blur(13px) saturate(1.7) brightness(.55);opacity:0;transition:opacity .9s ease}
html[data-eco] #np .npbg{filter:brightness(.55)}
#np .npbg.on{opacity:1}
#np::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.62));pointer-events:none}
#np .npx{position:absolute;top:max(2.4vh,12px);left:2.4vw;z-index:5;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:28px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#np .npm{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:4vw;align-items:center;padding:7vh 5vw 5vh}
#np .npc{width:min(62vh,40vw);aspect-ratio:1;justify-self:center;border-radius:28px;overflow:hidden;transform-origin:0 0;display:grid;place-items:center;font-size:90px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 110px color-mix(in srgb,var(--npc) 45%,transparent)}
#np .npc img{width:100%;height:100%;object-fit:cover}
#np .npr{display:flex;flex-direction:column;gap:2.2vh;min-width:0;max-height:82vh}
#np .npt h2{font-size:clamp(26px,3.6vw,50px);font-weight:700;line-height:1.1;letter-spacing:-.01em}
#np .npt p{color:rgba(255,255,255,.72);font-size:clamp(15px,1.7vw,22px);margin-top:.4em}
#np .npl{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);padding:3vh 0}
#np .npl::-webkit-scrollbar{display:none}
#np .ln{font-size:clamp(20px,2.4vw,32px);font-weight:700;line-height:1.25;opacity:.32;padding:.3em 0;transition:opacity .35s,transform .35s;transform-origin:left center;cursor:pointer}
#np .ln.on{opacity:1;transform:scale(1.04)}
#np .npl.empty{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;color:rgba(255,255,255,.55);font-size:clamp(15px,1.5vw,19px);-webkit-mask-image:none;mask-image:none}
#np .npl.plain{white-space:pre-wrap;font-size:clamp(16px,1.7vw,22px);line-height:1.5;color:rgba(255,255,255,.85)}
#np .npk{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums;font-size:14px;color:rgba(255,255,255,.75)}
#np .npk .rng{flex:1}
#np .npb{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.8vw,26px)}
#np .npb button{width:clamp(44px,4.8vw,62px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(24px,2.6vw,34px);color:#fff}
#np .npb button:active{background:rgba(255,255,255,.14)}
#np .npb button.big{width:clamp(66px,7vw,92px);background:#fff;color:#0a0f1c;font-size:clamp(30px,3.4vw,44px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
#np .npb button.on{color:var(--npc)}
#np .npo{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#np .npo button{padding:.55em 1.2em;border-radius:999px;background:rgba(255,255,255,.13);font-size:15px;display:inline-flex;align-items:center;gap:.5em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#np .npo button .ico{font-size:1.3em}
.dock .mini .mcov,.dock .mini .info{cursor:pointer}
@media (orientation:portrait){#np .npm{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;padding-top:10vh}#np .npc{width:min(72vw,36vh)}#np .npr{max-height:none;height:100%;min-height:0}}

/* ---------- Fluidité : listes longues et mode économie ---------- */
.list .item{content-visibility:auto;contain-intrinsic-size:auto 76px}
.cgrid .card{content-visibility:auto;contain-intrinsic-size:auto 240px}
html[data-eco] *,html[data-eco] *::before,html[data-eco] *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html[data-eco] #scene .grain{display:none}
html[data-eco]{--glass:rgba(18,30,56,.74);--dockbg:rgba(10,18,36,.86)}
html[data-eco][data-theme=light]{--glass:rgba(255,255,255,.82);--dockbg:rgba(255,255,255,.9)}

/* ---------- Réglages : catégories ---------- */
.sset{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:18px;align-items:start;padding-bottom:4vh}
.snav{display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.sni{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:18px;border:1px solid transparent;text-align:left;width:100%}
.sni.on{background:var(--glass);border-color:var(--gline)}
.sni .sci{width:42px;height:42px;border-radius:13px;background:var(--chip);color:var(--acc2);display:grid;place-items:center;font-size:23px;flex:none}
.sni .sct{flex:1;min-width:0}.sni b{display:block;font-weight:500;font-size:clamp(15px,1.5vw,18px)}

"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ICON={
 video:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.2v5.6l5-2.8z" fill="currentColor"/></svg>',

 tv:'<svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>',
 play:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
 pause:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14" stroke-width="3.4"/></svg>',

};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
const fmt=s=>{if(!isFinite(s))return"0:00";s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(r).padStart(2,"0")};
let navDepth=(history.state&&history.state.d)||0,goingHome=false;const pushNav=st=>{navDepth++;history.pushState({...st,d:navDepth},"")};
const CFG0={sound:true,ui:true,fx:60,haptic:true,resume:true,autonext:true,motion:false,pin:"",subAuto:true,subSize:100,tr:60,bg:"nuit",immersive:true,eco:"auto",anim:false};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let CFG={...CFG0,...LS.get("mg.cfg",{})};const cfg=k=>CFG[k];const setCfg=o=>{Object.assign(CFG,o);LS.set("mg.cfg",CFG)};
document.documentElement.dataset.motion=CFG.motion?"reduce":"";
const applyTr=()=>document.documentElement.style.setProperty("--tr",(CFG.tr/100).toFixed(2));applyTr();
let LOWBAT=false,AUTOSLOW=!!JSON.parse(localStorage.getItem("mg.slow")||"false"),audUrl="",vidUrl="",covUrl="";
function applyEco(){const m=CFG.eco||"auto",eco=m==="on"||(m==="auto"&&(AUTOSLOW||LOWBAT)),h=document.documentElement;eco?h.setAttribute("data-eco","1"):h.removeAttribute("data-eco");
  const an=!!CFG.anim&&!eco&&!CFG.motion;an?h.setAttribute("data-anim","1"):h.removeAttribute("data-anim");if(window.MQ_READY){if(eco||CFG.motion)document.querySelectorAll(".mq.run").forEach(mqStop);else mqScan(document)}}
applyEco();
/* sonde de fluidité : anime brièvement le fond sous les surfaces en verre ; si l'appareil peine, le mode économie s'active (réglage Auto) */
function fpsWatch(){if(CFG.eco!=="auto"||document.hidden)return;const h=document.documentElement,t=[];let last=performance.now();const end=last+2600;h.setAttribute("data-probe","1");
  (function f(n){t.push(n-last);last=n;if(n<end&&!document.hidden)requestAnimationFrame(f);else{h.removeAttribute("data-probe");if(document.hidden||t.length<20)return;t.shift();t.sort((a,b)=>a-b);const slow=t[t.length>>1]>30;
    if(slow!==AUTOSLOW){AUTOSLOW=slow;localStorage.setItem("mg.slow",JSON.stringify(slow));applyEco();if(slow)toast("Mode économie activé pour garder l’application fluide")}}})(last)}

/* ---------- Profils passagers et mode enfant ---------- */

    el.querySelector("[data-go]").onclick=()=>{const all=LS.get(pk("games"),{});all[g.id]={opp,lvl};LS.set(pk("games"),all);gStart(g,el,opp,lvl)}};draw()}
function gStart(g,el,opp,lvl){
  if(opp!=="remote")return g.mount(el,{opp,lvl,peer:"l’ordinateur"});
  const rs=remoteState();if(!rs.ok)return toast(rs.why);
  const gid=Math.random().toString(36).slice(2,10),hostIdx=Math.random()<.5?0:1,o=g.invite?g.invite():{};o.first=Math.random()<.5?0:1;

function mountRemote(g,el,me,o){const c=GNET.cur;if(!c)return;const net={left:false,on:null,send:d=>{try{MGSync.gameSend({gid:c.gid,op:"move",d})}catch{}}};c.net=net;g.mount(el,{opp:"remote",me,o,net,peer:c.peer})}
function gnetRecv(m){if(!m||!m.op||!window.MGSync)return;

        if(e.target.closest("[data-y]")){closeModal();if(GNET.cur)return MGSync.gameSend({gid:m.gid,op:"busy"});home();open("jeux");
          GNET.cur={gid:m.gid,k:game.id,pending:false,left:false,peer:who,net:null};gameOpen=true;pushNav({g:1});$("#gTitle").textContent=game.t;$("#gExtra").innerHTML="";$("#gBody").innerHTML='<div class="gplay"><div class="gcard"></div></div>';
          mountRemote(game,$("#gBody .gcard"),m.guest,m.o||{});MGSync.gameSend({gid:m.gid,op:"accept"})}
        else if(e.target.closest("[data-n]")){closeModal();MGSync.gameSend({gid:m.gid,op:"decline"})}}});
    haptic("ok");sfx.match();return}
  const c=GNET.cur;if(!c||c.gid!==m.gid)return;
  if(m.op==="accept"&&c.pending&&c.start)c.start();

  else if(m.op==="peer-offline"){if(c.pending&&c.fail)c.fail("L’autre tablette est absente");else if(c.net){c.net.left=true;c.net.on&&c.net.on({op:"left"})}}
  else if(m.op==="move"){c.net&&c.net.on&&c.net.on(m.d)}

const say=(el,m,c="")=>{el.textContent=m;el.className=el.className.replace(/\b(win|lose)\b/g,"").trim()+(c?" "+c:"")};
const gHdr=(ctx,names)=>`<div class="gsub">${ctx.opp==="cpu"?"Contre l’ordinateur · "+LVN[ctx.lvl]:ctx.opp==="remote"?"Contre "+esc(ctx.peer)+(names?" · vous jouez "+names[ctx.me]:""):ctx.opp==="local"?"À deux sur cette tablette":ctx.opp==="solo"?"Seul":""}</div>`;
function resultMsg(ctx,st,p,N){
  if(p<0){say(st,"Match nul");sfx.draw();haptic("sel");return}
  const won=ctx.opp==="cpu"?p===0:ctx.opp==="remote"?p===ctx.me:true;
  if(ctx.opp==="cpu"||ctx.opp==="remote"){if(won){say(st,"Vous gagnez !","win");sfx.win();haptic("win")}else{say(st,(ctx.opp==="cpu"?"L’ordinateur":ctx.peer)+" gagne","lose");sfx.lose();haptic("lose")}}
  else{say(st,"Victoire : "+N[p]+" !","win");sfx.win();haptic("win")}}
const pick=a=>a[Math.random()*a.length|0];
const turnIsMine=(ctx,turn)=>ctx.opp==="local"||ctx.opp==="solo"||(ctx.opp==="cpu"?turn===0:turn===ctx.me);

/* ----- Morpion ----- */
const WIN3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win3=b=>{for(const l of WIN3)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return{m:b[l[0]],l};return null};
function mm3(b,p){const w=win3(b);if(w)return w.m==="O"?1:-1;if(b.every(Boolean))return 0;let best=p==="O"?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm3(b,p==="O"?"X":"O");b[i]="";best=p==="O"?Math.max(best,s):Math.min(best,s)}return best}
function aiMorpion(b,lvl){const free=[];b.forEach((v,i)=>{if(!v)free.push(i)});if(lvl==="easy"||(lvl==="mid"&&Math.random()<.4))return pick(free);
  let best=-2,mv=[];for(const i of free){b[i]="O";const s=mm3(b,"X");b[i]="";if(s>best){best=s;mv=[i]}else if(s===best)mv.push(i)}return pick(mv)}
function gMorpion(el,ctx){
  const M=["X","O"];let b,turn,over,first=ctx.opp==="remote"?(ctx.o.first|0):0,wl=[];
  el.innerHTML=gHdr(ctx,["les X","les O"])+'<div class="ttt"></div><div class="st"></div><button class="btn ghost" data-r>Nouvelle partie</button>';

  const draw=()=>{g.innerHTML=b.map((v,i)=>`<button data-i="${i}" class="${wl.includes(i)?"w":""}">${v?FL[v]:""}</button>`).join("");g.querySelectorAll("button").forEach(x=>x.onclick=()=>tap(+x.dataset.i))};
  const place=i=>{b[i]=M[turn];sfx.tick();const w=win3(b);
    if(w){over=true;wl=w.l;draw();return resultMsg(ctx,st,M.indexOf(w.m),["les X","les O"])}
    if(b.every(Boolean)){over=true;draw();return resultMsg(ctx,st,-1)}
    turn=1-turn;say(st,turnMsg());draw();if(ctx.opp==="cpu"&&turn===1)setTimeout(ai,420+Math.random()*380)};
  const tap=i=>{if(over||b[i]||!turnIsMine(ctx,turn)||(ctx.net&&ctx.net.left)){sfx.error();return}place(i);if(ctx.opp==="remote")ctx.net.send({op:"m",i})};
  const ai=()=>{if(!over&&turn===1&&ctx.opp==="cpu")place(aiMorpion(b,ctx.lvl))};
  const reset=f=>{b=Array(9).fill("");first=f;turn=f;over=false;wl=[];say(st,turnMsg());draw();if(ctx.opp==="cpu"&&turn===1)setTimeout(ai,500)};
  el.querySelector("[data-r]").onclick=()=>{const f=ctx.opp==="local"?0:1-first;if(ctx.opp==="remote")ctx.net.send({op:"again",first:f});reset(f)};
  if(ctx.net)ctx.net.on=d=>{if(d.op==="m"&&!over&&turn!==ctx.me&&!b[d.i])place(d.i);else if(d.op==="again")reset(d.first);else if(d.op==="left")say(st,ctx.peer+" a quitté la partie")};
  reset(first)}

/* ----- Puissance 4 ----- */
const R4=6,C4=7;
const dropRow=(b,c)=>{for(let r=R4-1;r>=0;r--)if(!b[r*C4+c])return r;return -1};
function p4win(b,p){for(let r=0;r<R4;r++)for(let c=0;c<C4;c++){if(b[r*C4+c]!==p)continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;while(k<4){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R4||cc<0||cc>=C4||b[rr*C4+cc]!==p)break;k++}if(k===4)return true}}return false}
function evalP4(b,pl){const op=pl===1?2:1;let sc=0;for(let r=0;r<R4;r++){const v=b[r*C4+3];if(v===pl)sc+=3;else if(v===op)sc-=3}
  const part=cells=>{let a=0,o=0,e=0;for(const v of cells)v===pl?a++:v===op?o++:e++;if(a&&o)return 0;if(a===3&&e===1)return 50;if(a===2&&e===2)return 8;if(o===3&&e===1)return -60;if(o===2&&e===2)return -6;return 0};
  for(let r=0;r<R4;r++)for(let c=0;c<C4;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[];let ok=true;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R4||cc<0||cc>=C4){ok=false;break}cells.push(b[rr*C4+cc])}if(ok)sc+=part(cells)}return sc}
function negaP4(b,d,a,be,pl){const op=pl===1?2:1;if(p4win(b,op))return -100000-d;const cols=[3,2,4,1,5,0,6].filter(c=>!b[c]);if(!cols.length)return 0;if(d===0)return evalP4(b,pl);
  let best=-1e9;for(const c of cols){const r=dropRow(b,c);b[r*C4+c]=pl;const s=-negaP4(b,d-1,-be,-a,op);b[r*C4+c]=0;if(s>best)best=s;if(best>a)a=best;if(a>=be)break}return best}
function aiP4(b,lvl){const cols=[3,2,4,1,5,0,6].filter(c=>!b[c]);
  const winning=p=>{for(const c of cols){const r=dropRow(b,c);b[r*C4+c]=p;const w=p4win(b,p);b[r*C4+c]=0;if(w)return c}return -1};
  if(lvl==="easy"){if(Math.random()<.3){const w=winning(2);if(w>=0)return w}return pick(cols)}
  let w=winning(2);if(w>=0)return w;w=winning(1);if(w>=0)return w;
  if(lvl==="mid"){const safe=cols.filter(c=>{const r=dropRow(b,c);if(r<=0)return true;b[r*C4+c]=2;b[(r-1)*C4+c]=1;const bad=p4win(b,1);b[(r-1)*C4+c]=0;b[r*C4+c]=0;return!bad});const pool=safe.length?safe:cols;return Math.random()<.6?pool[0]:pick(pool)}
  let best=-1e9,bc=cols[0];for(const c of cols){const r=dropRow(b,c);b[r*C4+c]=2;const s=-negaP4(b,5,-1e9,1e9,1);b[r*C4+c]=0;if(s>best){best=s;bc=c}}return bc}
function gP4(el,ctx){const N=["rouges","jaunes"];let b,turn,over,first=ctx.opp==="remote"?(ctx.o.first|0):0;
  el.innerHTML=gHdr(ctx,["les rouges","les jaunes"])+'<div class="p4"></div><div class="st"></div><button class="btn ghost" data-r>Nouvelle partie</button>';
  const g=el.querySelector(".p4"),st=el.querySelector(".st");
  const turnMsg=()=>ctx.opp==="cpu"?(turn===0?"À vous de jouer (rouges)":"L’ordinateur réfléchit…"):ctx.opp==="remote"?(turn===ctx.me?"À vous de jouer ("+N[ctx.me]+")":"Au tour de "+ctx.peer):"Au tour des "+N[turn];
  const draw=()=>{g.innerHTML=b.map((v,i)=>`<button data-c="${i%C4}" class="${v===1?"r":v===2?"y":""}" aria-label="Colonne ${i%C4+1}"></button>`).join("");g.querySelectorAll("button").forEach(x=>x.onclick=()=>tap(+x.dataset.c))};
  const play=c=>{const r=dropRow(b,c);if(r<0)return false;b[r*C4+c]=turn+1;sfx.drop();draw();
    if(p4win(b,turn+1)){over=true;resultMsg(ctx,st,turn,["les rouges","les jaunes"]);return true}
    if(b.every(Boolean)){over=true;resultMsg(ctx,st,-1);return true}
    turn=1-turn;say(st,turnMsg());if(ctx.opp==="cpu"&&turn===1)setTimeout(ai,450+Math.random()*350);return true};
  const tap=c=>{if(over||!turnIsMine(ctx,turn)||(ctx.net&&ctx.net.left)){sfx.error();return}if(!play(c)){sfx.error();haptic("err");return}if(ctx.opp==="remote")ctx.net.send({op:"m",c})};
  const ai=()=>{if(!over&&turn===1&&ctx.opp==="cpu")play(aiP4(b,ctx.lvl))};
  const reset=f=>{b=Array(R4*C4).fill(0);first=f;turn=f;over=false;say(st,turnMsg());draw();if(ctx.opp==="cpu"&&turn===1)setTimeout(ai,500)};
  el.querySelector("[data-r]").onclick=()=>{const f=ctx.opp==="local"?0:1-first;if(ctx.opp==="remote")ctx.net.send({op:"again",first:f});reset(f)};
  if(ctx.net)ctx.net.on=d=>{if(d.op==="m"&&!over&&turn!==ctx.me)play(d.c);else if(d.op==="again")reset(d.first);else if(d.op==="left")say(st,ctx.peer+" a quitté la partie")};
  reset(first)}

/* ----- Memory ----- */
const memDeck=()=>{const s=[0,1,2,3,4,5,6,7];return[...s,...s].sort(()=>Math.random()-.5)};
function gMemory(el,ctx){const solo=ctx.opp==="solo",PM={easy:.3,mid:.6,hard:.95}[ctx.lvl]||.6;let c,up,lock,turn,score,moves,known,first=ctx.opp==="remote"?(ctx.o.first|0):0,over;
  el.innerHTML=gHdr(ctx)+'<div class="mem"></div><div class="st"></div><div class="st sc"></div><button class="btn ghost" data-r>Nouvelle partie</button>';
  const g=el.querySelector(".mem"),st=el.querySelector(".st"),sc=el.querySelector(".sc");
  const myIdx=ctx.opp==="remote"?ctx.me:0,lab=i=>ctx.opp==="cpu"?(i===0?"Vous":"Ordinateur"):ctx.opp==="remote"?(i===ctx.me?"Vous":ctx.peer):"Joueur "+(i+1);
  const info=()=>{sc.textContent=solo?"Coups : "+moves:lab(myIdx)+" "+score[myIdx]+" – "+score[1-myIdx]+" "+lab(1-myIdx)};
  const turnMsg=()=>solo?"Retrouvez les paires":ctx.opp==="cpu"?(turn===0?"À vous de jouer":"L’ordinateur joue…"):ctx.opp==="remote"?(turn===ctx.me?"À vous de jouer":"Au tour de "+ctx.peer):"Au tour du joueur "+(turn+1);
  const draw=()=>{g.innerHTML=c.map((v,i)=>{const ok=v===-1;return`<button data-i="${i}" class="${ok?"ok":up.includes(i)?"up":""}">${ok?FL.ok:up.includes(i)?FL.sym[v]:""}</button>`}).join("");g.querySelectorAll("button").forEach(x=>x.onclick=()=>tap(+x.dataset.i))};
  const flip=i=>{up.push(i);sfx.tick();if(Math.random()<PM)known.set(i,c[i]);draw();
    if(up.length===2){lock=true;setTimeout(resolve,800)}else if(ctx.opp==="cpu"&&turn===1)setTimeout(aiFlip,520)};
  const tap=i=>{if(over||lock||c[i]===-1||up.includes(i)||!turnIsMine(ctx,turn)||(ctx.net&&ctx.net.left)){return}flip(i);if(ctx.opp==="remote")ctx.net.send({op:"f",i})};
  const resolve=()=>{const[a,b2]=up;moves++;
    if(c[a]===c[b2]){c[a]=c[b2]=-1;score[turn]++;known.delete(a);known.delete(b2);sfx.match();haptic("ok")}else{sfx.miss();if(!solo)turn=1-turn}
    up=[];lock=false;draw();info();
    if(c.every(v=>v===-1)){over=true;if(solo){say(st,"Bravo, terminé en "+moves+" coups !","win");sfx.win();haptic("win")}else{const p=score[0]>score[1]?0:score[1]>score[0]?1:-1;resultMsg(ctx,st,p,["le joueur 1","le joueur 2"])}return}
    say(st,turnMsg());if(ctx.opp==="cpu"&&turn===1)setTimeout(aiFlip,550)};
  const aiFlip=()=>{if(over||lock||ctx.opp!=="cpu"||turn!==1)return;const free=c.map((v,i)=>v!==-1&&!up.includes(i)?i:-1).filter(i=>i>=0);let i;
    if(!up.length){const by={};for(const[k,v]of known)if(c[k]!==-1)(by[v]=by[v]||[]).push(k);const pair=Object.values(by).find(l=>l.length>=2);const fresh=free.filter(k=>!known.has(k));i=pair?pair[0]:pick(fresh.length?fresh:free)}
    else{const m=[...known].find(([k,v])=>k!==up[0]&&c[k]!==-1&&v===c[up[0]]);const fresh=free.filter(k=>!known.has(k));i=m?m[0]:pick(fresh.length?fresh:free)}
    if(i!==undefined)flip(i)};
  const reset=(f,dk)=>{c=dk||memDeck();up=[];lock=false;over=false;first=f;turn=solo?0:f;score=[0,0];moves=0;known=new Map();say(st,turnMsg());draw();info();if(ctx.opp==="cpu"&&turn===1)setTimeout(aiFlip,600)};
  el.querySelector("[data-r]").onclick=()=>{const f=solo||ctx.opp==="local"?0:1-first,dk=memDeck();if(ctx.opp==="remote")ctx.net.send({op:"again",first:f,deck:dk});reset(f,dk)};
  if(ctx.net)ctx.net.on=d=>{if(d.op==="f"&&!over&&!lock&&turn!==ctx.me&&c[d.i]!==-1&&!up.includes(d.i))flip(d.i);else if(d.op==="again")reset(d.first,d.deck);else if(d.op==="left")say(st,ctx.peer+" a quitté la partie")};
  reset(first,ctx.opp==="remote"?ctx.o.deck:null)}

/* ----- Pierre-feuille-ciseaux ----- */
function gPfc(el,ctx){let w=0,l=0,n=0,mine=null,theirs=null,busy=false;const hist=[],E={p:FL.rock,f:FL.paper,c:FL.scis},K=["p","f","c"],beat={p:"c",f:"p",c:"f"};
  el.innerHTML=gHdr(ctx)+'<div class="pfc">'+K.map(k=>`<button data-k="${k}">${E[k]}</button>`).join("")+'</div><div class="pfr"></div><div class="st big">Faites votre choix</div><div class="st sc"></div>';
  const big=el.querySelector(".big"),sc=el.querySelector(".sc"),pr=el.querySelector(".pfr"),btns=[...el.querySelectorAll("[data-k]")];
  const other=ctx.opp==="remote"?ctx.peer:"Ordinateur";
  const aiPick=()=>{let pred=null;if(ctx.lvl!=="easy"&&hist.length>=2){const cnt={p:0,f:0,c:0};(ctx.lvl==="hard"?hist.slice(-6):hist).forEach(k=>cnt[k]++);pred=K.sort((a,b)=>cnt[b]-cnt[a])[0]}
    const pr2=ctx.lvl==="hard"?.65:ctx.lvl==="mid"?.4:0;return pred&&Math.random()<pr2?K.find(k=>beat[k]===pred):pick(K)};
  const reveal=(m,o)=>{busy=true;n++;hist.push(m);pr.innerHTML=E[m]+E[o];let r,cl="";
    if(m===o){r="Égalité";sfx.draw();haptic("sel")}else if(beat[m]===o){w++;r="Gagné !";cl="win";sfx.win();haptic("win")}else{l++;r="Perdu…";cl="lose";sfx.lose();haptic("lose")}
    big.textContent=r;big.className="st big "+cl;sc.textContent="Vous "+w+" – "+l+" "+other+" · "+n+" manche"+(n>1?"s":"");
    setTimeout(()=>{mine=null;theirs=null;busy=false;btns.forEach(b=>b.classList.remove("on"));if(!(ctx.net&&ctx.net.left)){big.textContent="Manche suivante : faites votre choix";big.className="st big"}},1700)};
  btns.forEach(b=>b.onclick=()=>{if(busy||mine||(ctx.net&&ctx.net.left))return;const k=b.dataset.k;mine=k;b.classList.add("on");sfx.tick();
    if(ctx.opp==="cpu")return reveal(k,aiPick());
    ctx.net.send({op:"c",k});if(theirs)reveal(mine,theirs);else{big.textContent="En attente de "+ctx.peer+"…";big.className="st big"}});
  if(ctx.net)ctx.net.on=d=>{if(d.op==="c"&&!theirs){theirs=d.k;if(mine)reveal(mine,theirs)}else if(d.op==="left"){big.textContent=ctx.peer+" a quitté la partie";big.className="st big"}}}

/* ----- Plus ou moins ----- */
function gNombre(el,ctx){let s,n,done;const remote=ctx.opp==="remote";
  el.innerHTML=gHdr(ctx)+'<div class="st">J’ai choisi un nombre entre 1 et 100.</div><input class="numin" type="number" inputmode="numeric" min="1" max="100" placeholder="?"><button class="btn" data-g>Proposer</button><div class="st big"></div><button class="btn ghost" data-r>Nouvelle partie</button>';
  const inp=el.querySelector("input"),out=el.querySelector(".big");
  const reset=sec=>{s=sec||(1+Math.random()*100|0);n=0;done=false;out.innerHTML="";out.className="st big";inp.value=""};

function parseLrc(t){const lines=[];let off=0;for(const raw of String(t).split(/\r?\n/)){const o=raw.match(/^\[offset:\s*(-?\d+)\]/i);if(o){off=+o[1];continue}const ts=[...raw.matchAll(/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];if(!ts.length)continue;const txt=raw.replace(/\[[^\]]*\]/g,"").trim();for(const m of ts)lines.push({t:+m[1]*60+ +m[2]+(m[3]?+("0."+m[3]):0)-off/1000,text:txt})}return lines.sort((a,b)=>a.t-b.t)}

  doc.addEventListener("touchmove",e=>{if(!st||!BK.m.paged)return;const t=e.touches[0],dx=t.clientX-st.x,dy=t.clientY-st.y;
    if(!st.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.4&&!bkHasSel()){st.drag=true;BK.rd.style.transition="none";BK.rd.style.willChange="transform"}else return}

      return}
    if(Math.abs(dx)<10&&Math.abs(dy)<10&&dt<420&&!bkHasSel()){tapped=Date.now();bkTap({target:e.target,clientX:t.clientX,clientY:t.clientY,preventDefault(){}})}},{passive:true});

  const f=$("#bkF");if(BK.m.paged){const x=e.clientX/f.clientWidth;if(x<.27)bkPrev();else if(x>.73)bkNext();else bkChrome()}
  else{const y=e.clientY/f.clientHeight;if(y<.2)bkPrev();else if(y>.8)bkNext();else bkChrome()}}
function bkKey(e){if(!BK.open||/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||""))return;

const CRC_T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0,cds=0;
  for(const f of files){const nb=enc.encode(f.name),d=typeof f.data==="string"?enc.encode(f.data):f.data,crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nb.length,true);
    parts.push(lh.buffer,nb,d);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nb);cds+=46+nb.length;off+=30+nb.length+d.length}
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cds,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:"application/epub+zip"})}

 {id:"voyage",t:"Le Voyage des Heures Lentes",a:"Camille Verne",h:28,ch:[
  ["Le départ",["Il y a des matins où la route semble avoir été posée là pour nous seuls. Le jour se lève sans bruit, la brume s’attarde au creux des champs, et l’on comprend que le voyage a déjà commencé, bien avant la première borne.","Clara referma la porte sans la claquer, comme on ferme un livre que l’on compte rouvrir. Sur la banquette arrière, les sacs racontaient déjà l’histoire à venir : un plaid, une thermos, deux carnets et une carte que personne ne consulterait vraiment.","« Nous ne sommes pas pressés », dit son frère en bouclant sa ceinture. C’était la phrase qu’il fallait, la seule peut-être, pour que le trajet devienne autre chose qu’un déplacement.","Au bout de la rue, le soleil prit le pare-brise en écharpe et dora la poussière du tableau de bord. On roula longtemps sans rien dire, et ce silence-là n’avait rien de gênant : il ressemblait à la politesse des gens qui s’aiment.","La première heure s’écoula ainsi, entre les haies et les clochers, au rythme tranquille d’une musique que la radio captait mal. Quelque part devant eux, une rivière attendait."]],
  ["La rivière",["La rivière apparut sans prévenir, derrière un rideau de peupliers. Elle coulait avec cette lenteur têtue des choses qui savent où elles vont, et ses reflets s’accrochaient aux roseaux comme des phrases inachevées.","On gara la voiture près d’un vieux lavoir. L’eau y chantait un air très simple, trois notes tout au plus, répétées à l’infini. Clara s’assit sur la pierre tiédie et laissa ses mains dans le courant.","Les heures, ici, n’avaient pas la même longueur qu’en ville. Elles s’étiraient, se déformaient, se posaient un instant sur une libellule avant de repartir. On aurait dit qu’elles avaient, elles aussi, décidé de ne pas se presser.[[n1]]","Un pêcheur salua d’un signe de tête, sans interrompre son geste. Il y a des courtoisies qui se passent de mots et des amitiés qui durent le temps d’un regard échangé de part et d’autre d’une rive.","Avant de repartir, le frère de Clara photographia l’eau. L’image, il le savait, ne montrerait rien de ce qu’il avait ressenti ; mais il garderait la photo comme on garde un billet de train, pour le plaisir de se souvenir que l’on a voyagé."],"fig"],
  ["Le pont de pierre",["Le pont de pierre enjambait la vallée depuis plus de trois siècles. Ses arches, usées par les crues, portaient la marque des mains qui les avaient bâties et celle des pas qui, depuis, les avaient adoucies.","On le traversa à pied, par respect. Au milieu, Clara s’arrêta pour écouter. Il y avait le vent, bien sûr, mais aussi autre chose : un bourdonnement léger, venu de très loin, comme si la pierre elle-même se souvenait.","> Marcher, c’est lire le monde à la vitesse des pas.","De l’autre côté, un café minuscule proposait des tartines et du thé noir. La patronne, qui parlait peu, remplit les tasses avec la lenteur d’une cérémonie, et personne n’eut l’idée de regarder sa montre.","Plus tard, en reprenant la route, ils eurent la certitude étrange d’avoir laissé quelque chose derrière eux sur le pont : peut-être une inquiétude, peut-être seulement l’habitude d’aller vite."]],
  ["La nuit des cloches",["Le soir tomba doucement sur les toits d’ardoise. Dans le village où ils s’arrêtèrent, les cloches de l’église sonnaient l’heure avec trois minutes de retard, et personne ne songeait à s’en plaindre.","L’auberge sentait la cire et le pain chaud. On leur donna une chambre sous les combles, avec une fenêtre qui s’ouvrait sur un océan de tuiles. Clara resta longtemps accoudée, à regarder les lumières s’éteindre une à une.","Elle pensa à tous ceux qui, ce soir, regardaient eux aussi une fenêtre. Il y avait là une fraternité discrète, faite de cheminées qui fument et de volets que l’on tire, et qui ne demande aucune explication.","Les cloches sonnèrent une dernière fois. Dans le silence qui suivit, Clara comprit que ce voyage n’avait pas de destination : il avait seulement besoin d’être vécu, lentement, jusqu’au bout de la nuit et au-delà."]]],
  notes:{n1:"Une heure lente est une heure que l’on regarde passer. C’est, dit-on, la seule façon de ne pas la perdre."}},
 {id:"manuel",t:"Petit manuel du passager",a:"MG Divertissement",h:200,ch:[
  ["Bien préparer le trajet",["Un beau voyage commence avant le départ. Quelques minutes de préparation suffisent à transformer des heures de route en un moment agréable pour tous les passagers.","- Recharger les tablettes et les appareils avant de partir.","- Télécharger films, musiques et livres : le réseau n’est pas toujours disponible.","- Prévoir une couverture légère, une bouteille d’eau et quelques en-cas simples.","- Choisir à l’avance une première playlist, pour éviter les longues hésitations.","Le plus important : décider ensemble du rythme. Une pause toutes les deux heures rend le trajet plus sûr et plus confortable pour chacun."]],
  ["Occuper les longues heures",["Lire, écouter, jouer, regarder : tout est affaire de moment. Voici quelques idées pour alterner les plaisirs sans jamais se lasser.","| Moment | Idée |","| Matin | Un livre court ou un album tranquille |","| Après-midi | Un film en famille, ou des jeux à deux |","| Soirée | Une musique douce et la lecture d’un chapitre |","Les jeux à deux tablettes, comme le morpion ou la bataille de pierre-feuille-ciseaux, remettent un peu de rire entre les places arrière."]],
  ["Lire en voiture",["Pour lire confortablement, choisissez un thème de lecture adapté à la lumière : le thème Papier en plein jour, le thème Nuit après le coucher du soleil.","Un texte un peu plus grand et des marges normales fatiguent moins les yeux sur les routes qui bougent. Surlignez les passages que vous aimez : ils seront rassemblés dans l’onglet Repères.","Si la lecture donne mal au cœur, regardez au loin quelques instants, ou passez à un livre audio ou à une musique : le voyage n’en sera que plus doux."]]],
  notes:{}}];

  const files=[{name:"mimetype",data:"application/epub+zip"},{name:"META-INF/container.xml",data:'<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="EPUB/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>'}];
